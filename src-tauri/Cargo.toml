[package]
name = "dota2-game-helper2"
version = "1.3.4"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order：settings.json 要写回磁盘，默认的 BTreeMap 会把键按字母重排，
# 打散 settings::defaults() 里写好的顺序（常数表 2026-09-29 起不再落盘，这条理由只剩设置文件）
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
tiny_http = "0.12"
winreg = "0.52"

[dependencies.windows]
version = "0.58"
features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Globalization",
            "Win32_System_SystemInformation"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
