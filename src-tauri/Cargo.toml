[package]
name = "dota2-game-helper2"
version = "1.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order：常数表要写回磁盘且供人手编，默认的 BTreeMap 会把键按字母重排，
# 把 midRune/bounty/lotus 这种逻辑分组彻底打散
serde_json = { version = "1", features = ["preserve_order"] }
flate2 = "1"
tiny_http = "0.12"
winreg = "0.52"

[dependencies.windows]
version = "0.58"
features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_Globalization"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
