name: Pages

# 发布项目主页（首页那个 live demo 跑的是真覆盖层）。
#
# **组装逻辑全在 tools/build_site.py 里，这里只负责调它。** 写进 YAML 就没法本地
# 验了——`python tools/build_site.py --serve` 起出来的，和这里发出去的是同一份。
#
# **跟着发版走，不跟着 main 走**（2026-10-10 改）。主页上的下载按钮链的是最新 Release 里的文件，
# 下面还写着版本号——main 上的代码一合并就发，会出现"按钮指向还没发的版本"的空档
# （合并到打 tag 哪怕只隔几分钟）。所以改成 Release 流水线跑成功之后再发。
#
# - 只认**推 tag 触发**的那次 Release（`workflow_run.event == 'push'`）；手动空跑的 Release 不发
# - 在 Actions 页面手动 Run workflow 也能发：只改了主页文案、不想为它发一版程序的时候用
# - 用 workflow_run 而不是 `release: published`：Release 是流水线用 GITHUB_TOKEN 建的，
#   GITHUB_TOKEN 造出来的事件**不会触发别的流水线**，`release` 事件永远等不到
#
# 和 ci.yml 一样不能用 YAML 锚点——**GitHub Actions 不支持 anchor/alias**。
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只发一份，但**不取消进行中的那次**：取消到一半可能留下半新半旧的站点。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest      # 站点只是拷文件，不需要 Windows
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 组装 dist/
        run: python tools/build_site.py

      # demo 数据是从真实对局录制里裁出来的，理论上已经脱敏（tools/make_demo.py
      # 走白名单）。这道闸是给"以后有人放宽白名单或换了数据"准备的——
      # **发到公网之前再查一遍**，比事后发现便宜得多。
      - name: 确认 demo 数据里没有身份信息
        run: |
          if grep -aE 'steamid|accountid|"activity"' dist/demo.jsonl; then
            echo "::error::demo.jsonl 里出现了身份字段，已阻止发布"
            exit 1
          fi
          echo "demo.jsonl 干净"

      # **不要加 `enablement: true`。** 首次部署就是栽在这上面的：
      #
      #   Create Pages site failed.
      #   Error: Resource not accessible by integration
      #
      # 默认的 GITHUB_TOKEN 能**读**仓库的 Pages 配置，但没有**创建**它的权限，
      # 而且这不是靠 permissions: 里加一条能解决的——建站点那个接口不接受
      # workflow token。所以 Pages 必须先由人开一次（一次性）：
      #
      #   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
      #
      # 开完之后这一步就只是读配置，正常工作。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
